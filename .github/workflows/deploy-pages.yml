name: Repair layout and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read repository
        uses: actions/checkout@v6

      - name: Merge uploaded batches and verify offline resources
        shell: python
        run: |
          import ast
          import hashlib
          import json
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          target = root / '_site'
          if (root / '01-upload/index.html').is_file():
              sources = sorted(p for p in root.glob('[0-9][0-9]-upload') if p.is_dir())
          elif (root / 'index.html').is_file():
              sources = [root]
          else:
              raise RuntimeError('Missing index.html in repository root or 01-upload')

          target.mkdir(exist_ok=True)
          root_files = ['index.html', 'icon.svg', 'manifest.webmanifest', 'sw.js', '.nojekyll']
          for source in sources:
              files = [source / name for name in root_files if (source / name).is_file()]
              for folder in ['css', 'js', 'vendor']:
                  files.extend(p for p in (source / folder).rglob('*') if p.is_file())
              for file in files:
                  if file.is_symlink() or source.resolve() not in file.resolve().parents:
                      raise RuntimeError(f'Unexpected file path: {file}')
                  destination = target / file.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if destination.exists() and destination.read_bytes() != file.read_bytes():
                      raise RuntimeError(f'Conflicting upload batches: {destination}')
                  shutil.copyfile(file, destination)

          manifest = json.loads((target / 'vendor/manifest.json').read_text(encoding='utf-8'))
          for record in manifest['files']:
              file = (target / record['path']).resolve()
              if target.resolve() not in file.parents or not file.is_file():
                  raise RuntimeError(f"Missing OCR resource: {record['path']}")
              if hashlib.sha256(file.read_bytes()).hexdigest() != record['sha256']:
                  raise RuntimeError(f"Incomplete OCR upload: {record['path']}")

          offline_source = (target / 'js/offline.js').read_text(encoding='utf-8')
          paths = ast.literal_eval(re.search(r'APP_FILES=(\[.*?\]);', offline_source).group(1))
          for name in paths:
              file = target / name.removeprefix('./')
              if name != './' and not file.is_file():
                  raise RuntimeError(f'Missing website resource: {name}')
          if not (target / 'index.html').is_file() or not (target / 'sw.js').is_file():
              raise RuntimeError('Website entry or service worker is missing')
          (target / '.nojekyll').write_bytes(b'')
          print(f'Website assembled from {len(sources)} source folder(s). All OCR assets verified.')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload assembled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
